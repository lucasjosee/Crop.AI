name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — static checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  backend:
    name: Backend — static checks, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cropai_test
          POSTGRES_PASSWORD: cropai_test
          POSTGRES_DB: cropai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cropai_test -d cropai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://cropai_test:cropai_test@localhost:5432/cropai_test
      JWT_SECRET: ci-only-jwt-secret
      LLM_PROVIDER: gemini
      LLM_API_KEY: ci-placeholder-key
      LLM_MODEL_ID: gemini-test
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ci-placeholder-key
      S3_SECRET_KEY: ci-placeholder-secret
      S3_BUCKET: ci-test-bucket
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate -- --force
      - run: npm test
      - run: npm run build
